admin:
  traceback:
    shorten:
    - concurrent[\\\/]futures[\\\/]
    - dask[\\\/](base|core|local|multiprocessing|optimization|threaded|utils)\.py
    - dask[\\\/]array[\\\/]core\.py
    - dask[\\\/]dataframe[\\\/](core|methods)\.py
    - distributed[\\\/](client|scheduler|utils|worker)\.py
    - tornado[\\\/]gen\.py
    - pandas[\\\/]core[\\\/]
array:
  backend: numpy
  chunk-size: 128MiB
  rechunk:
    method: tasks
    threshold: 4
  slicing:
    split-large-chunks: null
  svg:
    size: 120
dataframe:
  backend: pandas
  convert-string: null
  parquet:
    metadata-task-size-local: 512
    metadata-task-size-remote: 1
  query-planning: false
  query-planning-warning: true
  shuffle:
    compression: null
    method: null
distributed:
  adaptive:
    interval: 1s
    maximum: .inf
    minimum: 0
    target-duration: 5s
    wait-count: 3
  admin:
    event-loop: tornado
    large-graph-warning-threshold: 10MB
    log-format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    log-length: 10000
    low-level-log-length: 1000
    max-error-length: 10000
    pdb-on-err: false
    system-monitor:
      disk: true
      gil:
        enabled: true
        interval: 1ms
      host-cpu: false
      interval: 500ms
      log-length: 7200
    tick:
      cycle: 1s
      interval: 20ms
      limit: 3s
  client:
    heartbeat: 5s
    preload: []
    preload-argv: []
    scheduler-info-interval: 2s
    security-loader: null
  comm:
    compression: false
    default-scheme: tcp
    offload: 10MiB
    require-encryption: null
    retry:
      count: 0
      delay:
        max: 20s
        min: 1s
    shard: 64MiB
    socket-backlog: 2048
    timeouts:
      connect: 30s
      tcp: 30s
    tls:
      ca-file: null
      ciphers: null
      client:
        cert: null
        key: null
      max-version: null
      min-version: 1.2
      scheduler:
        cert: null
        key: null
      worker:
        cert: null
        key: null
    ucx:
      create-cuda-context: null
      cuda-copy: null
      environment: {}
      infiniband: null
      nvlink: null
      rdmacm: null
      tcp: null
    websockets:
      shard: 8MiB
    zstd:
      level: 3
      threads: 0
  dashboard:
    export-tool: false
    graph-max-items: 5000
    link: '{JUPYTERHUB_SERVICE_PREFIX}proxy/{port}/status'
    prometheus:
      namespace: dask
  deploy:
    cluster-repr-interval: 500ms
    lost-worker-timeout: 15s
  diagnostics:
    computations:
      ignore-files:
      - runpy\.py
      - pytest
      - py\.test
      - pytest-script\.py
      - _pytest
      - pycharm
      - vscode_pytest
      - get_output_via_markers\.py
      ignore-modules:
      - asyncio
      - functools
      - datashader
      - dask
      - debugpy
      - distributed
      - coiled
      - cudf
      - cuml
      - matplotlib
      - pluggy
      - prefect
      - rechunker
      - xarray
      - xgboost
      - xdist
      max-history: 100
      nframes: 0
    cudf: false
    erred-tasks:
      max-history: 100
    nvml: true
  nanny:
    environ: {}
    pre-spawn-environ:
      MALLOC_TRIM_THRESHOLD_: 65536
      MKL_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    preload: []
    preload-argv: []
  p2p:
    comm:
      retry:
        count: 10
        delay:
          max: 30s
          min: 1s
    disk: true
  rmm:
    pool-size: null
  scheduler:
    active-memory-manager:
      interval: 2s
      measure: optimistic
      policies:
      - class: distributed.active_memory_manager.ReduceReplicas
      start: true
    allowed-failures: 3
    allowed-imports:
    - dask
    - distributed
    bandwidth: 100000000
    blocked-handlers: []
    contact-address: null
    dashboard:
      bokeh-application:
        allow_websocket_origin:
        - '*'
        check_unused_sessions_milliseconds: 500
        keep_alive_milliseconds: 500
      status:
        task-stream-length: 1000
      tasks:
        task-stream-length: 100000
      tls:
        ca-file: null
        cert: null
        key: null
    default-data-size: 1kiB
    default-task-durations:
      rechunk-split: 1us
      split-shuffle: 1us
    events-cleanup-delay: 1h
    http:
      routes:
      - distributed.http.scheduler.prometheus
      - distributed.http.scheduler.info
      - distributed.http.scheduler.json
      - distributed.http.health
      - distributed.http.proxy
      - distributed.http.statics
    idle-timeout: null
    locks:
      lease-timeout: 30s
      lease-validation-interval: 10s
    no-workers-timeout: null
    preload: []
    preload-argv: []
    unknown-task-duration: 500ms
    validate: false
    work-stealing: true
    work-stealing-interval: 100ms
    worker-saturation: 1.1
    worker-ttl: 5 minutes
  version: 2
  worker:
    blocked-handlers: []
    connections:
      incoming: 10
      outgoing: 50
    daemon: true
    http:
      routes:
      - distributed.http.worker.prometheus
      - distributed.http.health
      - distributed.http.statics
    lifetime:
      duration: null
      restart: false
      stagger: 0 seconds
    memory:
      max-spill: false
      monitor-interval: 100ms
      pause: 0.8
      rebalance:
        measure: optimistic
        recipient-max: 0.6
        sender-min: 0.3
        sender-recipient-gap: 0.1
      recent-to-old-time: 30s
      spill: 0.7
      spill-compression: auto
      target: 0.6
      terminate: 0.95
      transfer: 0.1
    multiprocessing-method: spawn
    preload: []
    preload-argv: []
    profile:
      cycle: 1000ms
      enabled: true
      interval: 10ms
      low-level: false
    resources: {}
    transfer:
      message-bytes-limit: 50MB
    use-file-locking: true
    validate: false
optimization:
  annotations:
    fuse: true
  fuse:
    active: null
    ave-width: 1
    max-depth-new-edges: null
    max-height: .inf
    max-width: null
    rename-keys: true
    subgraphs: null
temporary-directory: null
tokenize:
  ensure-deterministic: false
visualization:
  engine: null

